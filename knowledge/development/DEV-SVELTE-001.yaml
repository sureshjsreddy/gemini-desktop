id: DEV-SVELTE-001
type: development_standard
title: Svelte 5 Runes State Management & Tailwind CSS v4 Component Standard
domain: development
status: approved
version: 1.8.0
authority:
  level: official
  confidence: high
owner:
  team: frontend_team

applies_to:
  - frontend
  - components

rule:
  "Frontend development must use Svelte 5 runes (`$state`, `$derived`, `$effect`, `$props`) and Tailwind CSS v4 utility classes. Components must be modular, accessible, and responsive."

do:
  - "Use `$props()` for component inputs and `$state()` for local reactive state."
  - "Provide proper accessible labels (`<label for='...'>` + `<input id='...'>`) for all form controls."
  - "Use Tailwind CSS v4 theme colors (`slate-*`, `sky-*`, `emerald-*`, `rose-*`) for consistent dark-mode UI design."
  - "Support eye-comfort themes (`soft-dark` default with low-glare charcoal slate and `warm-dusk` sepia night reading) and modern developer typography (Plus Jakarta Sans, Inter, JetBrains Mono, Cascadia Code) with optional comfortable text scaling (`data-font-size=\"comfortable\"`)."
  - "Sanitize and render markdown safely with code syntax highlighting using `marked` and `highlight.js`."
  - "Ensure streaming token updates append smoothly without triggering layout jank or memory leaks."
  - "Use `dialogManager` (`dialog.alert`, `dialog.confirm`, `dialog.prompt`) with `DialogModal.svelte` for asynchronous, theme-adaptive user confirmations instead of browser dialogs."
  - "Ensure all dialog modals enforce strict accessibility: backdrop has `role=\"presentation\"` and `onkeydown` Escape handler; inner card has `role=\"dialog\"`, `aria-modal=\"true\"`, `tabindex=\"-1\"`, and `onkeydown={(e) => e.stopPropagation()}`."
  - "Replace HTML `autofocus` with programmatic focus inside `$effect` with a small `setTimeout` to eliminate `a11y_autofocus` compiler warnings."
  - "Use `$derived.by` for reactive configuration presets that depend on component props to avoid capturing initial state."
  - "Use `modalManager` (`src/lib/modal.svelte.ts`) to govern dialog modals (`search`, `workspace`, `templates`, `theme`, `mcp`) with `isOpen(type)`, `open(type)`, `close()`, and `toggle(type)`, preventing multiple competing open modals and eliminating scattered boolean flags."
  - "Decompose high-complexity views into focused subcomponents (e.g. `ToolPermissionCard.svelte`, `ToolCallNode.svelte`, `ChatPromptComposer.svelte`, `ChatMentionPopover.svelte`, `ChatSlashPopover.svelte`, `ExplorerContextMenu.svelte`, `ExplorerTreeRow.svelte`) and extract reusable domain logic into pure utility modules (`approvalModes.ts`, `toolSteps.ts`, `fileIcons.ts`, `fileFilters.ts`)."
  - "Group multi-step agent tool executions into a hierarchical progress tree via `ToolCallGroup.svelte`: while the agent is executing, tuck completed steps into an expandable accordion header (`[▶] Executing tasks (N/M completed)...`) and display only the currently active working step underneath; once all steps complete, tuck the entire sequence into a single compact header (`[▶] N steps completed`) with a toggleable tree view, keeping the assistant's final response clean and fully readable without terminal clutter."
  - "Enforce strict CSS stacking context hierarchy: header has `relative z-30`, chat message viewport has `z-0`, bottom prompt bar has `relative z-20`, tooltips elevate dynamically to `z-50` on hover, and dropdown menus (Export, Workspace profile) use `z-40` with outside-click dismissal backdrops so chat messages never occlude menus or tooltips."
  - "Design collateral navigation panels (Sidebar, SolutionExplorer) with dual-state layouts: full-width drawer when open, and a compact vertical icon strip (`w-12` on left, `w-7` on right) when collapsed to maximize chat and code viewing space while retaining 1-click access to core actions."
  - "Structure primary navigation with Pinned Chat Hero + Bottom Settings Hub layout (`Sidebar.svelte`): place high-frequency actions (`New Chat`, `Search History`) at the top, assign primary remaining height (`flex-1 min-h-0 overflow-y-auto`) exclusively to `Recent Chats` so conversations are never pushed below the fold, and consolidate developer drawer toggles (`Terminal`, `Workspace Explorer`) and low-frequency configuration tools (`Plugins`, `MCP`, `Settings`, `Setup`, `Theme`) into a compact bottom toolbar with an upward-floating popover menu."
  - "Maintain a single source of truth for active entities across views: track `activeSessionId = $state<string | null>(null)` and derive `activeSession = $derived(sessions.find((s) => s.id === activeSessionId) ?? null)`, updating `sessions` immutably via `.map()` synchronously before awaiting IPC calls so the left Sidebar and top ChatView header never desynchronize when switching chats during streaming."
  - "Streamline prompt composer toolbars (`ChatPromptComposer.svelte`) to eliminate visual clutter and toolbar wrapping: maintain only essential context controls (`Attach`, `Working Directory`) on the left and primary submission controls (`Send`/`Steer`/`Stop`) on the right; avoid duplicating status indicators (like Policy Approval Mode) that already exist in the header bar, and integrate specialized actions into the Attach menu and slash commands."
  - "Provide actionable empty chat states (`ChatView.svelte`) with dynamic engine identification (`activeEngine === 'agy' ? 'Antigravity CLI (agy)' : 'Gemini CLI'`) and interactive one-click starter prompt cards (Architecture, Git Changes, Feature Plan) to guide new conversations without blank-screen friction."
  - "Consolidate secondary conversation utilities (such as 'Compress Context' via `/compress`) into the Export & Actions dropdown menu, keeping the main chat header focused on session title, model telemetry, and active diff/plan workbench controls."

dont:
  - "Do not use legacy Svelte 3/4 `export let` syntax or stores (`writable`) when modern runes are available."
  - "Do not use inline arbitrary style attributes when Tailwind utility classes suffice."
  - "Do not use browser-native blocking modals (`window.alert`, `window.confirm`, `window.prompt`) which freeze the webview and disrupt IPC messaging."
  - "Do not maintain duplicate independent `$state` object references for `activeSession` and `sessions[]` items that can drift out of sync across async `await` boundaries."

reason:
  "Svelte 5 runes provide fine-grained reactivity, reduced boilerplate, and optimal bundle size for desktop SPAs."

