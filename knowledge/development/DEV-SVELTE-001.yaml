id: DEV-SVELTE-001
type: development_standard
title: Svelte 5 Runes State Management & Tailwind CSS v4 Component Standard
domain: development
status: approved
version: 1.1.0
authority:
  level: official
  confidence: high
owner:
  team: frontend_team

applies_to:
  - frontend
  - components

rule:
  "Frontend development must use Svelte 5 runes (`$state`, `$derived`, `$effect`, `$props`) and Tailwind CSS v4 utility classes. Components must be modular, accessible, and responsive."

do:
  - "Use `$props()` for component inputs and `$state()` for local reactive state."
  - "Provide proper accessible labels (`<label for='...'>` + `<input id='...'>`) for all form controls."
  - "Use Tailwind CSS v4 theme colors (`slate-*`, `sky-*`, `emerald-*`, `rose-*`) for consistent dark-mode UI design."
  - "Sanitize and render markdown safely with code syntax highlighting using `marked` and `highlight.js`."
  - "Ensure streaming token updates append smoothly without triggering layout jank or memory leaks."
  - "Use `dialogManager` (`dialog.alert`, `dialog.confirm`, `dialog.prompt`) with `DialogModal.svelte` for asynchronous, theme-adaptive user confirmations instead of browser dialogs."
  - "Ensure all dialog modals enforce strict accessibility: backdrop has `role=\"presentation\"` and `onkeydown` Escape handler; inner card has `role=\"dialog\"`, `aria-modal=\"true\"`, `tabindex=\"-1\"`, and `onkeydown={(e) => e.stopPropagation()}`."
  - "Replace HTML `autofocus` with programmatic focus inside `$effect` with a small `setTimeout` to eliminate `a11y_autofocus` compiler warnings."
  - "Use `$derived.by` for reactive configuration presets that depend on component props to avoid capturing initial state."
  - "Wrap interactive icon buttons, actions, and status indicators with `Tooltip.svelte` for accessibility and keyboard/hover discoverability."
  - "Enforce strict CSS stacking context hierarchy: header has `relative z-30`, chat message viewport has `z-0`, bottom prompt bar has `relative z-20`, tooltips elevate dynamically to `z-50` on hover, and dropdown menus (Export, Workspace profile) use `z-40` with outside-click dismissal backdrops so chat messages never occlude menus or tooltips."

dont:
  - "Do not use legacy Svelte 3/4 `export let` syntax or stores (`writable`) when modern runes are available."
  - "Do not use inline arbitrary style attributes when Tailwind utility classes suffice."
  - "Do not use browser-native blocking modals (`window.alert`, `window.confirm`, `window.prompt`) which freeze the webview and disrupt IPC messaging."

reason:
  "Svelte 5 runes provide fine-grained reactivity, reduced boilerplate, and optimal bundle size for desktop SPAs."

related_items:
  - ARCH-SYS-001
  - DEV-TEST-001
