id: PROD-SETTINGS-001
type: product_standard
title: Dual-Engine Global CLI Settings GUI & Configuration Standard
domain: product
status: approved
version: 1.2.0
authority:
  level: official
  confidence: high
owner:
  team: product_ux_team

applies_to:
  - frontend
  - backend
  - commands
  - settings
  - CliSettingsModal

rule:
  "Gemini Desktop must provide a first-class, interactive settings modal for viewing and modifying global CLI configurations for both Gemini CLI (`~/.gemini/settings.json`) and Antigravity CLI (`~/.gemini/antigravity-cli/settings.json`). The UI must dynamically route to the active engine's configuration file, support bidirectional synchronization between graphical form controls and an inline editable JSON viewer, validate all syntax, preserve user-defined unknown JSON keys, and guarantee atomic read/write operations without corrupting configs."

do:
  - "Dynamically route settings read/write operations based on the active CLI engine: `%USERPROFILE%/.gemini/settings.json` for Gemini CLI and `%USERPROFILE%/.gemini/antigravity-cli/settings.json` for Antigravity CLI via `get_global_cli_settings` and `save_global_cli_settings`."
  - "Surface the active engine name and the exact disk file path dynamically in the modal title and subtitle."
  - "Auto-reload disk settings immediately when the active engine is changed."
  - "Preserve all existing unrecognized top-level and nested settings keys during updates by merging form changes onto the existing parsed JSON DOM."
  - "Provide dedicated GUI form sections for core CLI preferences: default model override (`general.model`), temperature (`general.temperature`), maximum output tokens (`general.maxOutputTokens`), Git ignore filtering (`fileFiltering.respectGitIgnore`), usage telemetry (`telemetry.enabled`), automatic context compression (`chatCompression.enabled`, `chatCompression.triggerTokenThreshold`), maximum turn limits (`session.maxTurns`), and disk session retention (`session.retentionDays`)."
  - "Provide a live Raw JSON tab with syntax highlighting, indentation, and real-time JSON validation before permitting save actions."
  - "Provide a 1-click 'Restore Defaults' action resetting form values to recommended baseline values without immediately overwriting disk until confirmed."
  - "Surface accessible entry points in both the expanded sidebar menu ('CLI Settings') and collapsed sidebar icon strip (`w-8 h-8` icon button with tooltip)."
  - "Gracefully handle missing settings files by initializing standard defaults and creating parent directories on save."

dont:
  - "Never share or cross-contaminate settings between `~/.gemini/settings.json` and `~/.gemini/antigravity-cli/settings.json`."
  - "Never discard user-defined custom settings or third-party CLI flags present in settings files when saving from GUI forms."
  - "Never write invalid JSON to settings files; reject malformed syntax and present inline error feedback to the user."
  - "Never lock or freeze the UI thread while reading or saving disk settings."

reason:
  "Users need a convenient, error-free way to configure their underlying CLI runtime environments (including `.gitignore` filtering, model overrides, and token ceilings) directly inside Gemini Desktop without having to locate and manually edit hidden dotfiles in text editors."

