id: PROD-TOOL-001
type: product_standard
title: Interactive Tool Permission Approval & Safe System Execution
domain: product
status: approved
version: 1.3.0
authority:
  level: official
  confidence: high
owner:
  team: security_and_product

applies_to:
  - frontend
  - backend
  - acp_client

rule:
  "When the Gemini agent requests tool execution, the system must govern permissions via the official Policy Engine approval modes (default, auto_edit, yolo, plan). Approval modes must be configured strictly within Workspace Settings; all UI mode indicators (header and prompt composer) must be static display badges to prevent accidental mode alterations."

do:
  - "Provide a prominent static Mode Badge in the ChatView header and bottom prompt composer displaying the active policy mode (⚡ Auto-Edit, 🚀 YOLO, 🛡️ Ask Permission, 📋 Plan Mode)."
  - "Enforce that approval modes can only be changed intentionally through the Workspace Settings modal (`WorkspaceModal.svelte`), keeping UI header and prompt composer mode indicators strictly static."
  - "Provide real-time inline tool execution badges in the chat stream during autonomous YOLO and Auto-Edit execution so the user has continuous progress visibility."
  - "Default to `auto_edit` mode to minimize developer prompt fatigue by auto-approving safe workspace inspection (reads, searches, listings) and file edits (`write_file`, `replace`), while prompting for external system shell execution."
  - "Configure approval mode per workspace in Workspace Settings (`ask`, `auto_edit`, `yolo`, `plan`), mapping cleanly to ACP mode IDs (`default`, `autoEdit`, `yolo`, `plan`)."
  - "Synchronize mode dynamically at runtime via `session/set_mode` on each prompt, and display active mode badge in the bottom chat prompt bar."
  - "Pass `--approval-mode <mode>` (or `--yolo`) and `--skip-trust` flags when launching the underlying Gemini CLI process."
  - "Display the tool name, command parameters, locations, and context reason clearly in the approval prompt."
  - "Send the decision back through `respond_tool_permission` command over ACP stdin."

dont:
  - "Do not allow switching, toggling, or cycling approval modes by clicking UI header pills, prompt bar badges, or permission prompts; all mode changes must occur via Workspace Settings."
  - "Do not execute unconfirmed destructive system commands silently when in Ask (`default`) mode."
  - "Do not force users to answer repetitive permission prompts for safe file changes when running in `auto_edit` or `yolo` modes."
  - "Do not use deprecated `tools.exclude` configuration; use official Policy Engine approval modes and rule evaluations."

reason:
  "Balancing safety with ergonomics requires flexible policy modes: developers doing fast refactoring need auto-approvals for code edits, while security-sensitive operations or unfamiliar repositories benefit from strict interactive prompts."

related_items:
  - ARCH-ACP-001
  - DEV-SVELTE-001
  - PROD-UPDATE-001
