id: PROD-TERM-001
type: product_standard
title: Integrated Terminal Drawer, PowerShell Workspace Execution & Session Sync
domain: product
status: approved
version: 1.2.0
authority:
  level: official
  confidence: high
owner:
  team: frontend_and_core

applies_to:
  - frontend
  - backend
  - terminal
  - process_manager

rule:
  "The desktop app must provide an integrated workspace terminal drawer (`Ctrl+` `) that dynamically adapts to the active CLI engine (Gemini CLI or Antigravity CLI `agy`), injecting detected CLI binary paths and workspace environment variables into PowerShell without script bypass flags."

do:
  - "Provide a collapsible bottom drawer toggleable via shortcut (`Ctrl+` `) or UI buttons with height expansion controls."
  - "Execute commands via native shell (`powershell.exe` on Windows, `sh` on Unix) bound to the current workspace root directory."
  - "Execute Windows PowerShell commands without `-ExecutionPolicy Bypass` (using standard `-NoProfile -NonInteractive -Command`) to prevent triggering CrowdStrike Falcon MITRE T1059.001 Scripting Policy Bypass IOAs."
  - "Automatically detect and prepend both `find_agy_executable()` and `find_gemini_executable()` binary directories to the terminal process `PATH` so `agy` and `gemini` commands run out-of-the-box regardless of Windows user/system PATH state."
  - "Enforce a 3-tier safe fallback directory hierarchy (`fallback_safe_terminal_dir`: active workspace directory -> `%USERPROFILE%` -> `%LOCALAPPDATA%\\GeminiDesktop`), strictly prohibiting drive roots, `%WINDIR%`, `Program Files`, and `%TEMP%` as terminal working directories."
  - "Automatically check for, parse, and inject workspace `.env` and `.env.local` files into the shell process environment on every command execution."
  - "Capture and format stdout, stderr, exit code, and millisecond execution duration in a scrollable console."
  - "Display dynamic engine pill badge in terminal header: 'Antigravity (agy)' (purple) or 'Gemini CLI' (blue)."
  - "Offer engine-adaptive quick-action buttons: common developer actions (`git status`, `dir`, `View .env`) alongside Antigravity commands (`agy models`, `agy mcp`, `agy plugins`) or Gemini commands (`gemini -v`)."
  - "Provide an interactive environment sync action ('Reload Antigravity' or 'Reload Gemini') invoking `restart_gemini_session` to reset active ACP child processes and apply newly added `.env` keys on next turn."
  - "Render engine-tailored welcome consoles detailing relevant commands, environment variable setup, and quick actions."

dont:
  - "Do not block the webview UI thread during terminal execution."
  - "Do not run terminal commands without binding to the active workspace directory when configured."
  - "Do not execute PowerShell commands with `-ExecutionPolicy Bypass`, which triggers enterprise EDR behavioral detection rules."
  - "Do not spawn terminal processes with working directories set to system roots (`C:\\`, `C:\\Windows`), `Program Files`, or volatile `%TEMP%`."

reason:
  "Developers frequently need to inspect repository status, verify build scripts, or check git diffs alongside conversation with the AI model without switching to external terminal windows. Removing script bypass flags and isolating working directories ensures smooth operation in corporate environments monitored by CrowdStrike Falcon or Microsoft Defender."

