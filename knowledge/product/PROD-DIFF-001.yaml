id: PROD-DIFF-001
type: product_standard
title: Session File Changes, In-Memory Snapshots & Visual Diff Standard
domain: product
status: approved
version: 1.3.0
authority:
  level: official
  confidence: high
owner:
  team: product_ux_team

applies_to:
  - frontend
  - backend
  - acp_client
  - components
  - session_diff

rule:
  "Gemini Desktop must provide complete file change inspection, unified line diffing, and 1-click reverting for any Windows workspace folder, regardless of whether the folder is under Git source control. This feature is opt-in per workspace (`track_file_changes: boolean`, default `false`). When disabled, all ACP client handlers and background workers must completely skip snapshotting, file copying, manifest writing, and event broadcasting to guarantee zero overhead for Git-managed repositories. When enabled, changes must be strictly scoped to mutating tools executed during the conversation, leverage Git HEAD as an authoritative baseline for Git repositories, guard against heavy files (> 10 MB), repair corrupt or false 'did_not_exist' manifest states, and ensure committed repository files are never destroyed upon revert."

do:
  - "Default `track_file_changes` to `false` on new and existing workspaces, enabling users to opt-in from Workspace Settings modal."
  - "Provide high-contrast, accessible toggle switches in Workspace Settings modal showing green (`bg-emerald-500` + `ON`) when enabled and grey (`bg-slate-400/40 dark:bg-slate-700` + `OFF`) when disabled."
  - "Strictly enforce zero-overhead execution: all ACP tool handlers (`tool_call`, `tool_call_update`, `request_permission`, and `fs/write_text_file`) MUST verify `acp_session.is_track_file_changes_enabled()` before executing any snapshotting, manifest operations, or emitting `session-files-updated`."
  - "Enforce Mutating Tool Gatekeeper (`is_mutating_tool`): only snapshot and track files when the invoking tool is a genuine file-mutating operation (`write_file`, `edit_file`, `replace_file_content`, `apply_diff`, `patch_file`, `create_file`, `delete_file`, `append_to_file`, `fs/write_text_file`)."
  - "Explicitly reject read-only operations (`read_file`, `read_text_file`, `view_file`, `grep_search`, `search_files`, `find_by_name`, `list_directory`, `glob`) from file tracking and pre-snapshotting."
  - "Strictly ignore assistant message markdown backticks: mere discussion or code quotation of a file path in chat must NEVER track the file as modified or created."
  - "Leverage Git HEAD as authoritative baseline (`get_git_head_content`): in Git-managed workspaces, query `git show HEAD:<rel_path>` to establish the true pre-conversation content before claiming a file is newly created or diffing against `/dev/null`."
  - "Perform automatic manifest auditing and repair: if an entry in `manifest.json` claims `status_at_snapshot: 'did_not_exist'`, verify whether Git HEAD possesses the file. If present in Git HEAD, correct the status to `'existed'` and cache the HEAD content as the snapshot."
  - "Purge clean manifest entries: if a file in `manifest.json` was never modified by a mutating tool and its disk content is identical to Git HEAD or its snapshot, automatically purge the entry and snapshot file to eliminate spurious diff badges."
  - "Enforce Safe Revert Guarantee (`revert_session_file_internal`): verify Git tracking (`is_file_tracked_by_git`) before ever deleting a file. If tracked by Git, restore its original content from Git HEAD or snapshot; NEVER delete committed files with `fs::remove_file`."
  - "Normalize Windows file paths case-insensitively (`normalize_relative_path`): ensure drive letter variations (`c:/` vs `C:/`) strip workspace prefixes cleanly without returning None."
  - "Cap snapshots at 10 MB (MAX_SNAPSHOT_FILE_SIZE) to prevent disk and memory exhaustion when large files (e.g. databases, binaries, media) are encountered."
  - "Detect binary files and render concise size/binary status instead of running expensive text diffs."
  - "Compute additions, deletions, and standard unified line diffs in native Rust using `similar::TextDiff::from_lines` with context radius 3."
  - "Surface a `[ 📝 Changes (N) +X -Y ]` badge in the ChatView header whenever one or more files have been modified or created during the active conversation and tracking is enabled."
  - "Provide an interactive `SessionChangesModal` featuring a selectable file list, status badges (Modified, Created, Deleted), line numbers, and color-coded insertions and deletions."
  - "Provide right-click context menu and diff header quick actions matching Workspace Explorer: Open with Default App, Open with Notepad, Reveal in Windows Explorer, Copy Relative Path, and Copy Full Path."
  - "Support single-file revert and all-files revert, cleanly restoring original file contents or deleting genuinely created agent scratch files."
  - "Emit `session-files-updated` events over Tauri IPC upon ACP tool completion and prompt completion only when tracking is enabled to keep frontend diff counters and badges updated in real time."
  - "Cleanly purge session snapshot directories (`%LOCALAPPDATA%\\GeminiDesktop\\snapshots\\<session_id>\\`) when a conversation is deleted."

dont:
  - "Never treat a file as modified or created merely because it was mentioned in assistant markdown backticks or read by a read-only tool."
  - "Never assume an existing file on disk was 'did_not_exist' simply because an in-memory or snapshot file was absent."
  - "Never diff an existing Git-tracked file against /dev/null; always diff against Git HEAD."
  - "Never execute `fs::remove_file` on Git-tracked files during a revert operation."
  - "Never execute file snapshots, disk copying, manifest loading/saving, or IPC diff broadcasts when `track_file_changes` is false for the active workspace."
  - "Never pull in external files created by the user or other applications outside the conversation."
  - "Never copy heavy files (> 10 MB) into snapshot cache to prevent disk exhaustion."
  - "Never leave orphan snapshot folders on disk after a user deletes a session."

reason:
  "Users must have 100% confidence that Change Tracking accurately reflects only files genuinely modified or created by the agent. Diffing existing committed files against /dev/null causes severe confusion, and deleting existing files on revert risks catastrophic data loss. Grounding change tracking in Git HEAD provides bulletproof baseline verification for repositories while preserving zero-overhead snapshotting for non-Git folders."

