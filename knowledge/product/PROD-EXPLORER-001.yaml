id: PROD-EXPLORER-001
type: product_standard
title: Workspace Explorer Tree Navigation, Context Attachment & File Filtering
domain: product
status: approved
version: 1.5.0
authority:
  level: official
  confidence: high
owner:
  team: frontend_and_product

applies_to:
  - frontend
  - components
  - workspace

rule:
  "The Workspace Explorer provides an interactive, Visual Studio 2022-inspired hierarchical file tree docked on the right side of the workspace canvas. Files and folders are loaded dynamically on demand without artificial file limits, and users can search files explicitly off-thread with instant atomic cancellation and attach items directly to the chat prompt."

do:
  - "Dock Workspace Explorer to the right margin with collapsible auto-hide tab and horizontal resizing handle (240px–600px)."
  - "Load only root-level items initially on workspace mount/switch, keeping all directories collapsed by default for zero latency and instant rendering."
  - "Dynamically lazy-load subfolder contents on-demand via `read_workspace_dir` when a user clicks to expand a folder."
  - "Provide an explicit Enter-driven search (`search_workspace_files`) that executes asynchronously off-thread via Tokio `spawn_blocking` with zero UI latency."
  - "Support atomic search cancellation (`cancel_workspace_search` via `AtomicU64` generation token) so in-flight traversals abort immediately on Escape, input clear, or new query submission."
  - "Match search query strictly against file names (not directory paths) to prevent noisy false-positive matches from parent folder names."
  - "Display matching files only (filtering out folder noise) with subtle relative directory breadcrumbs (e.g. `in src/lib/components`) and capped at 100 matches for sub-10ms rendering."
  - "Instantly restore the lazy-loaded tree view when search is cleared via Escape or the reset button."
  - "Filter out dotfiles and dotfolders (names starting with `.`) by default, with an `Eye`/`EyeOff` toggle button in the toolbar to reveal them on demand."
  - "Provide a 'Collapse All Folders' action button (`ChevronsDownUp`) in the toolbar to quickly collapse the tree hierarchy."
  - "Provide multi-select mode (`isSelectMode`) with checkboxes to batch-select multiple files or folders and attach them to chat context with one click."
  - "Provide instant single-click inline attachment (`Paperclip` icon) and `@mention` insertion (`@` icon) on hover for any file or directory row."
  - "Render distinct Visual Studio 2022 color badges and icons based on file type and extension."
  - "Support context menu and double-click actions: open in system default app via native Rust command `open_workspace_file` (with automatic Windows Notepad fallback for unassociated file types, bypassing frontend plugin-opener ACL restrictions), reveal in Windows Explorer, and copy relative path."
  - "Provide keyboard shortcuts: `Ctrl+Alt+L` to toggle Workspace Explorer and `Ctrl+;` to focus the file search bar."

dont:
  - "Do not preload entire multi-thousand file trees upfront or cap browsing at arbitrary limits like 3,000 files."
  - "Do not provide an 'Expand All' option that can accidentally mount tens of thousands of DOM nodes and freeze the webview."
  - "Do not run synchronous filesystem traversal on Tauri's IPC thread or Tokio worker threads without `tokio::task::spawn_blocking`."
  - "Do not execute search queries on every keystroke (`oninput`), which locks the webview JavaScript thread and re-evaluates deep DOM trees."
  - "Do not display empty intermediate folders when displaying search results; display only matching files with their relative directory context."
  - "Do not display hidden configuration or dotfiles by default unless toggled via the toolbar."

reason:
  "Off-thread native Rust filesystem searches via Tokio `spawn_blocking` with atomic cancellation tokens combined with explicit Enter-submission and capped result sets guarantee 0ms UI blocking, zero lag, and instant responsiveness even on massive repositories."

