id: PROD-UPDATE-001
type: product_standard
title: WinGet Update Detection & Interactive User Notification
domain: product
status: approved
version: 1.1.0
authority:
  level: official
  confidence: high
owner:
  team: product_team

applies_to:
  - frontend
  - backend
  - packaging

rule:
  "The desktop client must automatically check the Windows Package Manager (WinGet) catalog for available updates and display a non-intrusive interactive notification banner when a newer release is published. When the user chooses to upgrade, the application must confirm, release file locks by exiting gracefully, execute the upgrade in a detached batch console, and automatically relaunch upon success."

do:
  - "Query the local WinGet catalog asynchronously using `winget show SureshJanakiReddy.GeminiDesktop --accept-source-agreements` via `tokio::task::spawn_blocking` to avoid blocking the UI."
  - "Trigger automatic background update checks with a 3-second delay on application startup."
  - "Compare the latest version from WinGet against the current application version using semantic versioning."
  - "Provide a non-intrusive floating `UpdateNotificationBanner` presenting the new version number and 1-click update action."
  - "Prompt for user confirmation via `dialogManager.confirm` before closing the application to apply updates."
  - "Generate an external updater script (`gemini_desktop_updater.bat` in `%TEMP%`) that waits for process termination (`timeout /t 2` and `taskkill`), runs `winget upgrade --id SureshJanakiReddy.GeminiDesktop`, and automatically relaunches `gemini-desktop.exe` on exit code 0."
  - "Exit the Tauri process gracefully (`app.exit(0)`) with a short 600ms delay after spawning the updater to release all Windows file handles and prevent `ERROR_SHARING_VIOLATION` / `Access is denied` errors."
  - "Provide a 1-click 'Copy Command' button to copy the upgrade command to clipboard."
  - "Support version-specific dismissal stored in `localStorage` so users are not repeatedly prompted for the same version once dismissed."
  - "Provide a manual 'Check for Updates' action in the sidebar footer next to the version indicator."

dont:
  - "Do not block application startup or UI rendering with synchronous network or CLI queries."
  - "Do not perform silent, forced updates without user knowledge and approval."
  - "Do not attempt to run in-place binary upgrades while the primary executable is still open and running."
  - "Do not display aggressive, modal-blocking update dialogs on launch."

reason:
  "On Windows, the OS kernel places an exclusive lock on running executables. The updater batch script pattern decouples the installer from the active process, releasing the binary lock while guaranteeing automatic relaunch upon completion."

related_items:
