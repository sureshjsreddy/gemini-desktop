id: ARCH-ACP-001
type: architecture_standard
title: Agent Client Protocol (ACP) JSON-RPC Streaming & Tool Intercepts
domain: architecture
status: approved
version: 1.3.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

applies_to:
  - backend
  - acp_client

rule:
  "Communication with the underlying Gemini CLI process must adhere to the Agent Client Protocol (ACP) over standard I/O using JSON-RPC 2.0. Incoming stream deltas and tool execution requests must be parsed line-by-line and routed via Tauri events."

do:
  - "Spawn the Gemini CLI with piped stdin, stdout, and stderr (`Stdio::piped()`)."
  - "Run dedicated background reader threads for stdout and stderr to handle streaming tokens and telemetry asynchronously."
  - "Emit `acp-chunk` events for delta content updates and final completion (`is_done: true`)."
  - "Parse `sessionUpdate: \"tool_call\"` and `\"tool_call_update\"` in `session/update` notifications to stream real-time tool execution progress (`⚙️ Running tool...`, `✅ Completed`, `❌ Tool failed`) to the chat surface, preventing silent UI stalls during autonomous tool execution."
  - "Inspect `stopReason` (`max_turn_requests`, `max_tokens`, `cancelled`) on prompt completion responses and synthesize fallback notices when the model returns without text deltas, preventing dropped assistant responses."
  - "Listen to `acp-stderr` in the frontend to surface live diagnostics when the underlying model experiences API demand spikes (503/429) and exponential backoff retries."
  - "Intercept tool permission requests, pause execution, and emit `acp-tool-permission` to the frontend for explicit user confirmation or mode escalation before executing system commands."
  - "Map permission approval options to official ACP outcomes (`proceed_once`, `cancel`, `proceed_always`) to conform with Gemini CLI strict Zod schema validation."
  - "Track process lifecycle via a composite key (`format!(\"{}::{}\", workspace_id, effective_mode)`) so switching policy approval modes (`default`, `auto_edit`, `yolo`, `plan`) cleanly re-spawns the supervised CLI process."
  - "Pass `--approval-mode <mode>` (or `--yolo`) and `--skip-trust` CLI flags upon spawning to govern tool policy execution."
  - "Explicitly synchronize per-session policy approval mode via `session/set_mode` JSON-RPC requests (`modeId: \"default\" | \"autoEdit\" | \"yolo\" | \"plan\"`) to ensure ACP runtime matches workspace settings."
  - "Sanitize ACP agent chunks via `sanitize_acp_delta` to strip internal `[MODE_UPDATE] <mode>` control tags and emit `acp-mode-update` events, preventing runtime mode telemetry from polluting chat text."
  - "Explicitly configure active session models via `session/set_model` JSON-RPC requests prior to prompt dispatch."
  - "Isolate background streams per session ID (`streamStates[session_id]`) in the frontend and resolve ACP session mappings in the backend so users can switch between chats while the CLI is processing in the background without cross-talk or UI blocking."
  - "Provide a fallback mock/offline mode if the Gemini CLI executable is absent on PATH."

dont:
  - "Do not block the Tauri main thread or Tokio runtime waiting for ACP line responses."
  - "Do not auto-approve dangerous system tool calls without user permission when running in Ask (`default`) mode."
  - "Do not send invalid model parameters in ACP `session/new` or `session/prompt` payloads."

reason:
  "ACP allows full streaming, interactive agent pairing, cancelation, and safety guards over standard process streams without requiring network socket listeners."

related_items:
