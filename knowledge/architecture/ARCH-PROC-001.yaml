id: ARCH-PROC-001
type: architecture_standard
title: Windows Job Objects Process Supervision & Cleanup Standard
domain: architecture
status: approved
version: 1.3.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

applies_to:
  - backend
  - process_manager

rule:
  "On Windows, all spawned child processes (including Gemini CLI and subordinate tool processes) must be assigned to an OS Job Object configured with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE."

do:
  - "Initialize a Win32 Job Object handle (`CreateJobObjectW`) during ProcessSupervisor startup."
  - "Configure `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` using `SetInformationJobObject`."
  - "Assign every spawned child process handle to this Job Object immediately upon creation (`AssignProcessToJobObject`)."
  - "Wrap Windows handles safely with `Send` and `Sync` implementations."
  - "Inject non-interactive terminal environment flags (`CI=true`, `PAGER=cat`, `GIT_PAGER=cat`) into the Gemini CLI process to prevent subordinate tool executions (e.g. `git diff`, `git log`) from hanging on terminal pagers or interactive prompts."
  - "Parse workspace-level `.env` and `.env.local` files via `parse_dotenv_file` and automatically inject variables into spawned child processes (`spawn_gemini`, `run_terminal_command`)."
  - "Extract `--model` flags from extra CLI arguments and inject corresponding `GEMINI_MODEL` environment variable when spawning the Gemini CLI process."
  - "Extract `--approval-mode` flags from extra CLI arguments and inject corresponding `GEMINI_APPROVAL_MODE` environment variable when spawning the Gemini CLI process."
  - "Reap child processes (`c.wait()`), clear active workspace locks, and emit completion chunk (`is_done: true`) upon stdout EOF or process exit to eliminate hanging UI state."
  - "Provide safe session reset (`restart_gemini_session`) so updated environment variables take effect on the next prompt invocation."
  - "When terminating active child processes on workspace or approval mode switches (`needs_spawn`), execute `ProcessSupervisor::terminate_child` using Windows `taskkill /F /T /PID` to cleanly abort the entire process tree (`cmd.exe` + Node.js CLI runtime + child tools) and detach reaping (`child.wait()`) on a background thread to prevent deadlocking Tokio async executors."
  - "Pass `--skip-trust` to all spawned Gemini CLI instances (`spawn_gemini`, `test_gemini_cli`) and register directories into `~/.gemini/trustedFolders.json` via `ensure_folder_trusted` to prevent non-interactive prompt hangs on unapproved folders."
  - "Enforce an enterprise-safe working directory hierarchy (Priority 1: Active Workspace, Priority 2: `%USERPROFILE%`, Priority 3: `%LOCALAPPDATA%\\GeminiDesktop`), strictly avoiding `%TEMP%` to prevent CrowdStrike Falcon volatile-directory network IOA alerts and `Program Files` to prevent UAC `ERROR_ACCESS_DENIED` and privilege-escalation heuristics."

dont:
  - "Do not leave child processes running in the background when the user closes the main desktop window."
  - "Do not rely exclusively on SIGTERM or soft cancellation mechanisms that fail during abrupt application termination."
  - "Do not execute child processes or diagnostic tests with current working directory set to `%TEMP%` or `C:\\Program Files`."

reason:
  "Windows Job Objects guarantee at the OS kernel level that all child processes and their spawned sub-processes are immediately killed when the parent app terminates, preventing memory leaks and orphaned background processes. Proper working directory isolation prevents enterprise EDR false positives and UAC permission failures."

related_items:
